<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="color-scheme" content="light" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <!-- LCP: preload do hero. AVIF primeiro (menor); navegadores sem suporte ignoram pelo type. -->
    <link rel="preload" as="image" href="/hero-bg.avif" fetchpriority="high" type="image/avif" />
    <link rel="preload" as="image" href="/hero-bg.webp" fetchpriority="high" type="image/webp" />

    <!-- Preload das fontes do HERO (h1 Jakarta 800 + Inter 600/400 acima da dobra) -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/jakarta-800.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/inter-600.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/inter-400.woff2" crossorigin />

    <link rel="dns-prefetch" href="https://mkkehvaclefoxkdlcmqm.supabase.co" />
    <link rel="preconnect" href="https://mkkehvaclefoxkdlcmqm.supabase.co" crossorigin />
    <link rel="preconnect" href="https://awrbaterias.com.br" crossorigin />
    <link rel="dns-prefetch" href="https://awrbaterias.com.br" />

    <!-- CSS crítico inline: pinta hero acima da dobra sem esperar o bundle CSS -->
    <style>
      @font-face{font-family:"Plus Jakarta Sans";font-style:normal;font-weight:800;font-display:swap;src:url(/fonts/jakarta-800.woff2) format("woff2")}
      @font-face{font-family:"Inter";font-style:normal;font-weight:600;font-display:swap;src:url(/fonts/inter-600.woff2) format("woff2")}
      @font-face{font-family:"Inter";font-style:normal;font-weight:400;font-display:swap;src:url(/fonts/inter-400.woff2) format("woff2")}
      *,*::before,*::after{box-sizing:border-box}
      html,body{margin:0;padding:0}
      :root{
        --background:0 0% 98%;--foreground:0 0% 8%;
        --card:0 0% 100%;--card-foreground:0 0% 8%;
        --primary:0 85% 46%;--primary-foreground:0 0% 100%;
        --secondary:0 0% 10%;--secondary-foreground:0 0% 100%;
        --muted-foreground:0 0% 35%;
        --accent:45 100% 42%;--accent-foreground:0 0% 5%;
        --border:0 0% 88%;--ring:0 85% 46%;--radius:0.5rem;
        --awr-green:142 70% 40%;
      }
      body{
        background:hsl(var(--background));color:hsl(var(--foreground));
        font-family:Inter,"Inter Fallback",system-ui,-apple-system,"Segoe UI",sans-serif;
        -webkit-font-smoothing:antialiased;
        font-size:16px;line-height:1.5;
      }
      #root{min-height:100vh}
      h1,h2,h3{font-family:"Plus Jakarta Sans","Plus Jakarta Sans Fallback",Inter,system-ui,sans-serif;letter-spacing:-0.02em;margin:0}
      section#inicio{position:relative;display:flex;align-items:center;min-height:80vh;padding-top:64px;background:hsl(var(--secondary))}
      section#inicio>div:first-child{position:absolute;inset:0;z-index:0;background:hsl(var(--secondary))}
    </style>

    <!-- dataLayer + gtag stub (carregamento real em src/lib/loadTracking.ts, diferido) -->
    <script>
      window.dataLayer = window.dataLayer || [];
      window.gtag = window.gtag || function(){ window.dataLayer.push(arguments); };
      // Stub: enfileira a conversão até o gtag real carregar (em loadTracking.ts).
      window.gtag_report_conversion = window.gtag_report_conversion || function(url){
        if (typeof url !== 'undefined') { window.location.href = url; }
        return false;
      };
    </script>


    <title>AWR Baterias Porto Alegre | Entrega e instalação em 35 min</title>
    <meta name="description" content="Bateria automotiva entregue e instalada em até 35 minutos em Porto Alegre e região. Moura, Heliar, Zetta e Excell com garantia de fábrica. 10x sem juros.">
    <meta name="author" content="AWR Baterias" />

    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://storage.googleapis.com/gpt-engineer-file-uploads/lqAis5eidUX7SHe00lssQxM8bK23/social-images/social-1776525299009-D_NQ_NP_2X_714841-MLB72500892405_102023-F.webp">

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@Lovable" />
    <meta name="twitter:image" content="https://storage.googleapis.com/gpt-engineer-file-uploads/lqAis5eidUX7SHe00lssQxM8bK23/social-images/social-1776525299009-D_NQ_NP_2X_714841-MLB72500892405_102023-F.webp">
    <meta property="og:title" content="AWR Baterias Entrega e Instalação de baterias">
    <meta name="twitter:title" content="AWR Baterias Entrega e Instalação de baterias">
    <meta property="og:description" content="A bateria do seu carro entregue e instalada em até 35 minutos">
    <meta name="twitter:description" content="A bateria do seu carro entregue e instalada em até 35 minutos">
  </head>

  <body>
    <!-- Google Tag Manager (noscript) -->
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-5JTRM2L"
      height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
    <!-- End Google Tag Manager (noscript) -->
    <div id="root"><!-- Hero shell estático: pinta antes do bundle JS, evita FCP atrasado. React substitui ao montar. -->
      <div style="min-height:100vh;background:hsl(0 0% 98%)">
        <header style="position:fixed;top:0;left:0;right:0;height:64px;background:hsl(0 0% 10%);border-bottom:1px solid hsl(0 0% 88%);z-index:50;display:flex;align-items:center;padding:0 16px">
          <span style="font-family:'Plus Jakarta Sans','Plus Jakarta Sans Fallback',Inter,system-ui,sans-serif;font-weight:800;font-size:20px;color:#fff;letter-spacing:-0.02em">AWR <span style="color:hsl(0 85% 46%)">Baterias</span></span>
        </header>
        <section id="inicio" style="position:relative;display:flex;align-items:center;min-height:80vh;padding-top:64px;background:hsl(0 0% 10%);overflow:hidden">
          <div style="position:absolute;inset:0;z-index:0">
            <picture>
              <source type="image/avif" srcset="/hero-bg.avif" />
              <source type="image/webp" srcset="/hero-bg.webp" />
              <img src="/hero-bg.webp" alt="Técnico instalando bateria automotiva AWR" width="1200" height="900" sizes="100vw" fetchpriority="high" decoding="async" loading="eager" style="width:100%;height:100%;object-fit:cover" />
            </picture>
            <div style="position:absolute;inset:0;background:linear-gradient(to right,hsl(0 0% 10% / 0.95),hsl(0 0% 10% / 0.8) 50%,hsl(0 0% 10% / 0.4))"></div>
          </div>
          <div style="position:relative;z-index:10;width:100%;max-width:1280px;margin:0 auto;padding:48px 16px">
            <div style="max-width:42rem">
              <h1 style="font-family:'Plus Jakarta Sans','Plus Jakarta Sans Fallback',Inter,system-ui,sans-serif;font-weight:800;font-size:clamp(2.25rem,5vw,3.75rem);line-height:1.1;letter-spacing:-0.02em;color:#fff;margin:0 0 16px">Bateria entregue e instalada em até <span style="color:hsl(0 85% 46%)">35 minutos</span></h1>
              <p style="font-size:1.125rem;color:rgba(255,255,255,0.8);margin:0 0 24px">Encontre e escolha o modelo de bateria abaixo.</p>
              <div style="background:#fff;border-radius:1rem;padding:16px;box-shadow:0 10px 15px -3px rgba(0,0,0,0.1);min-height:88px;display:flex;gap:8px">
                <input type="text" placeholder="Carro e ano (Ex: Onix 2018)" style="flex:1;height:48px;border:1px solid hsl(0 0% 88%);border-radius:0.375rem;padding:0 12px;font-size:16px" aria-label="Buscar veículo" />
                <button style="height:48px;background:hsl(0 85% 46%);color:#fff;border:0;border-radius:0.375rem;padding:0 20px;font-weight:700;font-size:14px">Buscar</button>
              </div>
            </div>
          </div>
        </section>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
