    <script>
      // Detecta modo iframe (shortcode [awr_app] do tema WP) o mais cedo possível.
      // Define flag global usada pelo restante do app e pelo CSS (data-embed=1).
      window.__AWR_EMBED__ = false;
      try {
        if (new URLSearchParams(location.search).get('embed') === '1') {
          window.__AWR_EMBED__ = true;
          document.documentElement.setAttribute('data-embed','1');
        }
      } catch(_) {}
    </script>

    <!-- LCP: preload do hero. Sempre necessário (também é o LCP dentro do iframe). -->
    <link rel="preload" as="image" href="/hero-bg.avif" fetchpriority="high" type="image/avif" />
    <link rel="preload" as="image" href="/hero-bg.webp" fetchpriority="high" type="image/webp" />

    <!-- Tipografia Speedy: Plus Jakarta Sans (headings) + Inter (body) via Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet" />

    <!-- Supabase preconnect: necessário em ambos os modos (busca de baterias, cart, edge fns). -->
    <link rel="dns-prefetch" href="https://mkkehvaclefoxkdlcmqm.supabase.co" />
    <link rel="preconnect" href="https://mkkehvaclefoxkdlcmqm.supabase.co" crossorigin />

    <script>
      // Hints específicos do standalone: injetados em runtime para nunca
      // dispararem requisições no iframe (o tema WP do parent já cobre).
      (function(){
        if (window.__AWR_EMBED__) return;
        var head = document.head;
        var add = function(rel, href, attrs){
          var l = document.createElement('link');
          l.rel = rel; l.href = href;
          if (attrs) for (var k in attrs) l.setAttribute(k, attrs[k]);
          head.appendChild(l);
        };
        add('preconnect', 'https://awrbaterias.com.br', { crossorigin:'' });
        add('dns-prefetch', 'https://awrbaterias.com.br');
      })();
    </script>
