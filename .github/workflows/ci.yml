name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - name: Detectar páginas de teste
        run: npm run lint:test-pages
      - name: Detectar código órfão (knip)
        run: npm run lint:orphans
      - name: Build
        run: npm run build
      - name: SEO check (produção)
        run: npm run seo:check -- --warn
        continue-on-error: true
      - name: Upload SEO report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seo-report
          path: seo-report/
          if-no-files-found: ignore
