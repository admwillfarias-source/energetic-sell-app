name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - name: Detectar páginas de teste
        run: npm run lint:test-pages
      - name: Detectar código órfão (knip)
        run: npm run lint:orphans
      - name: Build
        run: npm run build
