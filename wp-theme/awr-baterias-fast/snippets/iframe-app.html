<!--
  AWR Baterias — Embed do app React no WordPress.
  Cole este bloco inteiro em um bloco "HTML personalizado" do Gutenberg
  ou em um widget HTML do Elementor. Não requer shortcode nem PHP.

  O iframe carrega https://bateria-facil.lovable.app/?embed=1 em tela cheia,
  com:
   • auto-resize: o app envia { type:"awr:height", height:N } e este script
     ajusta a altura real do wrapper (sem scroll interno, sem espaço vazio).
   • sincronia de viewport: o app pode pedir { type:"awr:requestViewport" }
     e recebe { type:"awr:viewport", top, height } com a faixa do iframe
     que está visível no navegador — necessário para que modais (busca,
     checkout) apareçam centrados na área que o usuário enxerga, e não
     no centro geométrico do iframe.
   • scroll assistido: o app pode pedir { type:"awr:scrollTo", y } para
     rolar a janela do WordPress até um ponto específico do iframe.
-->
<link rel="preconnect" href="https://bateria-facil.lovable.app" crossorigin>
<link rel="dns-prefetch" href="https://bateria-facil.lovable.app">

<style>
  .lovable-fullscreen-wrapper{
    position:relative;
    width:100%;
    height:100vh;      /* fallback */
    height:100dvh;     /* viewport real no mobile moderno */
    min-height:560px;  /* evita colapso em containers estreitos do tema */
  }
  /* iOS Safari legado */
  @supports (-webkit-touch-callout:none){
    .lovable-fullscreen-wrapper{height:-webkit-fill-available;}
  }
  .lovable-fullscreen-wrapper>iframe{
    position:absolute;inset:0;
    width:100%;height:100%;
    border:0;display:block;
    background:#fafafa;
  }
  /* Evita scroll lateral indesejado quando o tema é estreito */
  body{overflow-x:hidden;}
</style>

<div class="lovable-fullscreen-wrapper">
  <iframe
    data-awr-app="1"
    src="https://bateria-facil.lovable.app/?embed=1"
    title="AWR Baterias — Busca e pedido"
    loading="lazy"
    decoding="async"
    referrerpolicy="no-referrer-when-downgrade"
    allow="clipboard-write; payment; geolocation"
    sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox allow-top-navigation-by-user-activation"></iframe>
</div>

<script>
(function(){
  if (typeof window === "undefined") return;

  var wrapper = document.querySelector(".lovable-fullscreen-wrapper");
  var iframe  = wrapper && wrapper.querySelector("iframe[data-awr-app='1']");
  if (!wrapper || !iframe) return;

  /* ---------- 1) Auto-resize do iframe ----------
     O app envia { type:"awr:height", height:N }. Ajustamos a altura real
     para evitar scroll interno e espaço vazio. */
  function onHeight(d){
    if (typeof d.height !== "number" || d.height < 200) return;
    wrapper.style.height = Math.ceil(d.height) + "px";
  }

  /* ---------- 2) Sincronia de viewport parent → iframe ----------
     Calcula qual faixa do iframe está visível no viewport do navegador
     (em coordenadas do PRÓPRIO iframe) e envia para o app. Reenvia a cada
     scroll/resize (throttled via rAF). */
  var lastTop = -1, lastH = -1, vpFrame = 0, vpEnabled = false;
  function sendViewport(){
    vpFrame = 0;
    if (!vpEnabled) return;
    var rect = iframe.getBoundingClientRect();
    var winH = window.innerHeight || document.documentElement.clientHeight || 0;
    // Faixa visível em coords do iframe: top do iframe = -rect.top quando
    // o usuário rolou abaixo do início do iframe.
    var top = Math.max(0, -rect.top);
    var bottom = Math.min(rect.height, winH - rect.top);
    var visibleH = Math.max(0, bottom - top);
    if (visibleH < 80) return; // iframe ainda fora da tela
    if (top === lastTop && visibleH === lastH) return;
    lastTop = top; lastH = visibleH;
    try {
      iframe.contentWindow && iframe.contentWindow.postMessage(
        { type: "awr:viewport", top: top, height: visibleH }, "*"
      );
    } catch(_){}
  }
  function scheduleViewport(){
    if (vpFrame) return;
    vpFrame = (window.requestAnimationFrame || function(cb){return setTimeout(cb,16);})(sendViewport);
  }
  function enableViewportSync(){
    if (vpEnabled) { sendViewport(); return; }
    vpEnabled = true;
    window.addEventListener("scroll", scheduleViewport, { passive: true });
    window.addEventListener("resize", scheduleViewport, { passive: true });
    sendViewport();
  }

  /* ---------- 3) Scroll assistido ----------
     O app pede { type:"awr:scrollTo", y } (y em coords do iframe). Rolamos
     a janela do WP de modo que esse y fique perto do topo da viewport. */
  function onScrollTo(d){
    if (typeof d.y !== "number") return;
    var rect = iframe.getBoundingClientRect();
    var pageY = window.pageYOffset || document.documentElement.scrollTop || 0;
    var iframePageTop = rect.top + pageY;
    var targetY = iframePageTop + Math.max(0, d.y) - 12;
    try { window.scrollTo({ top: targetY, behavior: "smooth" }); }
    catch(_) { window.scrollTo(0, targetY); }
  }

  window.addEventListener("message", function(e){
    var d = e && e.data;
    if (!d || typeof d !== "object" || typeof d.type !== "string") return;
    if (e.source && e.source !== iframe.contentWindow) return;
    if (d.type === "awr:height")          onHeight(d);
    else if (d.type === "awr:requestViewport") enableViewportSync();
    else if (d.type === "awr:scrollTo")   onScrollTo(d);
  }, false);
})();
</script>
