<!--
  AWR Baterias — Embed do app React no WordPress.
  Cole este bloco inteiro em um bloco "HTML personalizado" do Gutenberg
  ou em um widget HTML do Elementor. Não requer shortcode nem PHP.

  O iframe carrega https://bateria-facil.lovable.app/?embed=1 em tela cheia,
  com auto-resize via postMessage (evento "awr:height") quando disponível.
-->
<link rel="preconnect" href="https://bateria-facil.lovable.app" crossorigin>
<link rel="dns-prefetch" href="https://bateria-facil.lovable.app">

<style>
  .lovable-fullscreen-wrapper{
    position:relative;
    width:100%;
    height:100vh;      /* fallback */
    height:100dvh;     /* viewport real no mobile moderno */
    min-height:560px;  /* evita colapso em containers estreitos do tema */
  }
  /* iOS Safari legado */
  @supports (-webkit-touch-callout:none){
    .lovable-fullscreen-wrapper{height:-webkit-fill-available;}
  }
  .lovable-fullscreen-wrapper>iframe{
    position:absolute;inset:0;
    width:100%;height:100%;
    border:0;display:block;
    background:#fafafa;
  }
  /* Evita scroll lateral indesejado quando o tema é estreito */
  body{overflow-x:hidden;}
</style>

<div class="lovable-fullscreen-wrapper">
  <iframe
    data-awr-app="1"
    src="https://bateria-facil.lovable.app/?embed=1"
    title="AWR Baterias — Busca e pedido"
    loading="lazy"
    decoding="async"
    referrerpolicy="no-referrer-when-downgrade"
    allow="clipboard-write; payment; geolocation"
    sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox allow-top-navigation-by-user-activation"></iframe>
</div>

<script>
/* Auto-resize: o app envia { type:"awr:height", height:N } via postMessage.
   Se chegar, ajustamos a altura real para evitar scroll interno e espaço
   vazio. Se o JS não rodar ou a mensagem não chegar, o iframe permanece
   em viewport cheia (100dvh). */
(function(){
  if (typeof window === "undefined") return;
  window.addEventListener("message", function(e){
    var d = e && e.data;
    if (!d || typeof d !== "object" || d.type !== "awr:height") return;
    var w = document.querySelector(".lovable-fullscreen-wrapper");
    if (w && typeof d.height === "number" && d.height > 200){
      w.style.height = Math.ceil(d.height) + "px";
    }
  }, false);
})();
</script>
