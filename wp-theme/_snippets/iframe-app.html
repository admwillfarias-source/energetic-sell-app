<!--
  AWR Baterias — embed do app React em qualquer página/post WordPress.
  Cole este bloco inteiro em um bloco "HTML personalizado" do Gutenberg
  (ou em um widget HTML do Elementor). Não requer shortcode nem PHP.
-->
<link rel="preconnect" href="https://energetic-sell-app.lovable.app" crossorigin>
<link rel="dns-prefetch" href="https://energetic-sell-app.lovable.app">

<style>
  .lovable-fullscreen-wrapper{
    position:relative;
    width:100%;
    /* 100vh como fallback; 100dvh resolve barra de URL no mobile moderno */
    height:100vh;
    height:100dvh;
  }
  /* iOS Safari legado — usa o espaço visível real */
  @supports (-webkit-touch-callout:none){
    .lovable-fullscreen-wrapper{height:-webkit-fill-available;}
  }
  .lovable-fullscreen-wrapper>iframe{
    position:absolute;inset:0;
    width:100%;height:100%;
    border:0;display:block;
    background:#fafafa;
  }
  /* Evita scroll lateral indesejado quando o tema é estreito */
  body{overflow-x:hidden;}
</style>

<div class="lovable-fullscreen-wrapper">
  <iframe
    data-awr-app="1"
    src="https://energetic-sell-app.lovable.app/?embed=1"
    title="AWR Baterias"
    loading="lazy"
    decoding="async"
    fetchpriority="low"
    referrerpolicy="no-referrer-when-downgrade"
    allow="clipboard-write; payment; geolocation"
    sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox allow-top-navigation-by-user-activation"></iframe>
</div>

<script>
/* Auto-resize opcional: o app envia { type:"awr:height", height:N } via
   postMessage. Se chegar, libera o 100vh e ajusta para a altura real do
   conteúdo — sem scroll interno e sem espaço vazio. Se o JS não rodar,
   o iframe permanece em viewport cheia. */
(function(){
  if (typeof window === "undefined") return;
  window.addEventListener("message", function(e){
    var d = e && e.data;
    if (!d || typeof d !== "object" || d.type !== "awr:height") return;
    var w = document.querySelector(".lovable-fullscreen-wrapper");
    if (w && typeof d.height === "number" && d.height > 200){
      w.style.height = Math.ceil(d.height) + "px";
    }
  }, false);
})();
</script>
